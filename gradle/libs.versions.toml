[versions]
# project modules version
p-root = "1.0.0-dev"
p-lavender-api = "1.0.0-dev"
p-lavsource-spring-boot-starter = "1.0.0-dev"
p-lavsource-app-sdk = "1.0.0-dev"

# gradle plugins version
gp-honoka-basic = "1.0.2"
gp-honoka-android = "1.0.0"
gp-android-library = "8.11.1"

# android related version
a-compile-sdk = "33"
a-min-sdk = "26"

# dependencies version
d-kotlin = "2.2.0"
d-kotlin-coroutines = "1.10.2"
d-spring-boot = "3.5.4"
d-honoka-kotlin-utils = "1.1.3-dev"
d-honoka-spring-boot-starter = "1.0.4-dev"
d-lavender-api = "1.0.0-dev"
d-honoka-android-utils = "1.1.2-dev"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "d-kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "d-kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "d-kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "d-kotlin" }
android-library = { id = "com.android.library", version.ref = "gp-android-library" }
honoka-basic = { id = "de.honoka.gradle.plugin.basic", version.ref = "gp-honoka-basic" }
honoka-android = { id = "de.honoka.gradle.plugin.android", version.ref = "gp-honoka-android" }

[libraries]
honoka-kotlin-utils = { module = "de.honoka.sdk:honoka-kotlin-utils", version.ref = "d-honoka-kotlin-utils" }
honoka-spring-boot-starter = { module = "de.honoka.sdk:honoka-spring-boot-starter", version.ref = "d-honoka-spring-boot-starter" }
honoka-android-utils = { module = "de.honoka.sdk:honoka-android-utils", version.ref = "d-honoka-android-utils" }
lavender-api = { module = "de.honoka.lavender:lavender-api", version.ref = "d-lavender-api" }
